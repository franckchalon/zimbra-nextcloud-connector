# Fichier installé dans /opt/zimbra/conf/nextcloud-zimlet.properties
storage.dir=/opt/zimbra/data/nextcloud-zimlet
storage.shared=false
templates.dir=
ui.remote_backgrounds=false
ui.default_language=fr
# Valeurs gérées par install.sh : modern, classic ou both / primary ou backend-only.
ui.install_mode=both
deployment.node_role=primary
zimbra.public_url=https://mail.example.com
nextcloud.account_mode=manual
managed.nextcloud_url=
managed.admin_username=
managed.admin_app_password=
managed.group=
managed.quota=
managed.language=fr
nextcloud.allow_http=false
nextcloud.block_private_networks=true
nextcloud.private_hosts=
# Configuration bureautique globale par défaut. Chaque profil Cloud peut la surcharger depuis la Zimlet.
office.provider=onlyoffice
office.public_url=https://office.example.com
office.download_hosts=office.example.com
office.allow_http_downloads=false
office.security_mode=jwt
office.jwt_secret=REMPLACER_PAR_LE_SECRET_JWT_DU_SERVEUR_BUREAUTIQUE
office.jwt_header=Authorization
security.ticket_secret=REMPLACER_PAR_UNE_CLE_ALEATOIRE_DE_64_CARACTERES
security.ticket_ttl_seconds=604800
files.max_upload_bytes=1073741824
files.upload_chunk_bytes=8388608
files.max_office_download_bytes=1073741824
limits.max_concurrent_requests=24
limits.max_requests_per_account_minute=600
limits.max_directory_response_items=5000
mail.fallback_max_attachments=20
mail.fallback_max_attachment_bytes=104857600
http.connect_timeout_seconds=15
http.request_timeout_seconds=1800
talk.request_timeout_seconds=8
